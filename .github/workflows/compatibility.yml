name: Browser compatibility audit
on:
  push:
    branches: [audit/browser-compatibility]
    paths: ['src/**', 'tests/**', 'scripts/audit-safari.mjs', 'playwright*.js', '.github/workflows/compatibility.yml', 'package*.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safari:
    name: Apple Safari on macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24.21.0', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: sudo safaridriver --enable
      - run: node scripts/audit-safari.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: safari-compatibility-evidence
          path: artifacts/safari/
          retention-days: 14
